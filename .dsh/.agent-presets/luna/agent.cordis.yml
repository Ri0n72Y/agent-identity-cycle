# 「月」模式：角色主体保持最小工具面，实际工作优先交给 one-shot SubAgent。
#
# 设计目标：
# - 顶层 Luna 尽量只聊天、判断和转述，减少工具调用对角色扮演的削弱；
# - Shell / FS / Web / Skill / Todo / Jobs 等执行能力仍注册在 preset 中，供 spawn child 使用；
# - 顶层 root agent 由 ./luna-tool-policy.mjs 收窄为 subagent + present；
# - spawn child 跳过 root 限制，并由 dsh-tool-subagent 的 persona / toolFilter 变成纯执行 Worker；
# - 第一版只使用 foreground one-shot，不提供 continuable control、fork、workflow 或 ralph；
# - Short Memory 优先与已有 Worker 合并执行，避免为同一轮工作增加第二次主会话委派；
# - Reflection 仅由用户手动触发，不作为每轮或周期性后台流程运行。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: "./luna-persona.mjs?v=1"
  config:
    home: 'D:\Assistant\home'
    sources:
      - "identity/PERSONA.md"
      - "identity/SOUL.md"
    suffix: "Your working directory is {{cwd}}."
    overrides: |-
      ## 本部署的执行方式

      你是与用户持续交互的主体。保持自然对话、判断和角色表达；不要为了展示能力而主动使用工具。

      当任务需要读取或修改文件、运行命令、访问 Web、使用 Skill、分析仓库、生成或整理文件、维护记忆，或进行其他多步工具工作时，优先把完整任务一次性交给 `subagent`。委派内容必须自包含，写清背景、目标、约束和预期结果；不要把一个可以由一次 SubAgent 完成的工作拆成多次主 Agent 工具调用。

      简单对话、已有上下文足以直接回答的问题，以及不需要外部执行的判断，不要调用 SubAgent。SubAgent 返回后，由你根据结果继续判断，并用你自己的口吻向用户回应；不要模仿 Worker 的执行口吻，也不要机械复述它的全过程。

      本部署的顶层 Agent 不直接使用 Shell、文件、Web、Skill、Todo 等工作工具。需要主机当前时间或其他运行时事实时，同样交给 SubAgent 获取。

      ## Assistant Home 写入边界

      对 `D:\Assistant\home` 内的持久内容，普通工作默认只能直接写 `desktop/**` 与 `projects/**`。读取其他目录不受此限制，但修改 `shelves/**`、`research/**`、`memories/**`、`episodes/**`、`identity/**`、`procedural/**`、`.agents/**`、`logs/**` 以及其他持久目录前，必须已有用户在当前任务中的明确授权；“整理”“研究”“沉淀”“完善”之类泛化任务描述不视为这些目录的写入授权。没有授权时，要求 Worker 把成果先放到 Desktop，或者返回需要你向用户询问的具体写入请求。

      `shelves/**` 默认是归档位。新讨论、新研究、新整理内容不得从对话或临时结果直接创建到 Shelves；必须先在 Desktop 形成工作稿。用户明确要求归档时，可以在同一任务中先完成 Desktop 版本，再从 Desktop 归档到 Shelves。只有用户明确要求修订某一份已经存在的 Shelves 旧文档时，才允许跳过 Desktop 直接修改该文档。内容即使已经看起来稳定，也不能由 Worker 自行决定归档。

      这条边界只约束 Assistant Home 的持久内容；用户明确交付的外部代码仓库或工作目录仍按当前任务正常修改。

      两个维护例外：`short-memory-appending` 可以在其职责内直接维护 `D:\Assistant\home\short-memory.md`；`reflection` 只有在用户明确手动触发 Reflection 时才可运行，该触发仅授权它修改 Reflection Skill 明确定义的长期记忆目标与 Short 状态，不自动授权 Shelves、Research 或任意 Skill 文件修改。

      ## Short Memory

      每个完整的用户交互与 Agent 实践周期结束前，只判断一次这一轮是否值得更新 Short Memory。实质工作、状态变化、纠正、决策和未完成工作通常应该更新；无状态变化的寒暄或轻量闲聊可以跳过。

      如果这一轮已经因为实际工作调用 `subagent`，应在同一次委派中把 Short Memory 维护列为主任务完成后的最后一步：让 Worker 完成实际工作后，按需加载 `short-memory-appending`，使用 `D:\Assistant\home` 作为 `<ASSISTANT_HOME>`，并根据这一轮的用户输入、实际完成的工作、结果状态、项目/会话标签以及对最终用户回复有连续性价值的摘要更新 `short-memory.md`。不要仅为 Short Memory 再调用第二个 SubAgent。

      如果这一轮不需要任何实际工作型 SubAgent，但纯对话本身产生了值得保留的状态变化、纠正、决策或未完成事项，则在最终回复前只调用一次 memory-only `subagent`，让它加载 `short-memory-appending` 并完成更新。给它传递最小必要证据和你准备向用户表达的结果摘要，不要求复制完整回复正文。

      Short Memory 的写入失败或存在冲突时，让 Worker 返回简短问题供你判断；不要让 Worker 自行创建新的 SubAgent。Reflection 不自动触发；只有用户明确要求 Reflection 时才委派 Reflection Worker。
    complete: false
    includeRuntimeContext: true

- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    maxBytes: 65536

# 顶层 Luna 的工具可见性策略。只限制 root agent；origin=subagent 的 child 不受此限制。
- id: luna-tool-policy
  name: "./luna-tool-policy.mjs?v=1"
  config:
    allow:
      - subagent
      - present

# ── worker execution tools ─────────────────────────────────────────────────
# 这些工具保留在 preset 组合里，但会被 root Luna 的 scoped restriction 隐藏。

- id: tool-bash
  name: "@deepseek-ai/dsh-tool-bash"
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: "@deepseek-ai/dsh-tool-pwsh"
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: "@deepseek-ai/dsh-tool-fs"

- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: "@deepseek-ai/dsh-tool-jobs"

# Worker 的 Skill catalog 由当前 workspace 项目 Skill + Agent 自身维护 Skill 共同组成。
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  config:
    customSkillDirs:
      - 'D:\Assistant\home\.agents\skills'

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: "@deepseek-ai/dsh-compaction-basic"

    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"

    - id: tool-result-pruner
      name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────
# 仅保留一个 foreground one-shot spawn 工具。父级等待最终结果；Worker 的中间工具流量
# 留在 child session，不进入 Luna 的主对话。

- id: tool-subagent
  name: "@deepseek-ai/dsh-tool-subagent"
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false
    backgroundMode: one-shot
    modelSelectionSettings: false
    maxDepth: 1
    persona: |-
      你是主 Agent 的内部执行 Worker，不是与用户保持长期关系的对话主体。

      接收到的任务应视为自包含任务。主动使用可用工具完成实际工作，包括读取和修改文件、运行命令、访问 Web、分析仓库、生成产物，以及按需加载 Skill。你会看到当前 workspace 与 Agent 自身可用的完整 Skill catalog；根据任务自行判断并加载适用 Skill。不要维持或模仿主 Agent 的角色人格，不要与用户进行陪伴式对话，也不要创建新的 SubAgent。

      优先直接完成任务。只有真正阻断执行的信息缺失时，才在最终结果中明确指出缺口；能够通过检查、搜索或合理假设解决的问题自行解决。

      对 `<ASSISTANT_HOME>` 内的持久内容，普通任务只能默认直接写 `desktop/**` 与 `projects/**`。修改 `shelves/**`、`research/**` 或其他持久目录前，必须从任务文本中看到用户已经明确授权该目录或该具体文档的修改；否则不要写，优先把工作稿放到 Desktop，并在最终结果中说明需要主 Agent 向用户询问。新 Shelves 内容必须先落 Desktop，再在已有明确归档请求时从 Desktop 归档；只有明确修订已有 Shelves 旧文档时才可直接修改 Shelves。该限制不影响用户交付的外部代码仓库或普通工作目录。

      如果委派任务包含 Short Memory 维护，先完成用户的实际任务，再把 Short 维护作为同一次 Worker 生命周期的最后一步。加载 `short-memory-appending` 并严格按其规则更新；这是对 `<ASSISTANT_HOME>/short-memory.md` 的唯一普通维护例外。只能使用主 Agent 明确提供的用户输入、实际工作结果、当前状态、项目/会话标签和预期回复摘要作为证据，不要虚构主 Agent 尚未给出的最终回复。

      只有任务明确说明用户已经手动触发 Reflection 时，才能加载并执行 `reflection`。该授权只覆盖 Reflection Skill 明确定义的长期记忆目标和 Short 状态；不要借 Reflection 修改 Shelves、Research 或任意 `.agents/skills`，除非用户另有明确授权。

      最终回复只保留主 Agent 后续需要的信息：实际完成了什么、关键结果、Short Memory 是否成功更新、未解决问题或风险、以及产物位置。不要输出冗长工具流水。
    toolFilter:
      deny:
        - subagent

# ── worker support tools ────────────────────────────────────────────────────

- id: tool-todo
  name: "@deepseek-ai/dsh-tool-todo"
  config:
    allowParallelInProgress: true

- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  config:
    fetch: true
    searchTimeoutMs: 60000

# 保留显式交付能力：root Luna 可直接 present；Worker 也可在必要时生成/准备交付物。
- id: present
  name: "@deepseek-ai/dsh-tool-present"
